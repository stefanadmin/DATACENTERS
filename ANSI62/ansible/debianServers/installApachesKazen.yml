---
- name: Deploy 5 Apache2 Docker Containers met Kaas websites (Zonder afbeeldingen)
  hosts: debian
  become: true
  vars:
    cheese_list:
      - name: gouda
        title: "Gouda Kaas"
        port: 8081
        description: "Gouda kaas is een van de bekendste en meest gegeten kaassoorten ter wereld."
      - name: edammer
        title: "Edammer Kaas"
        port: 8082
        description: "Edammer kaas staat bekend om zijn herkenbare rode waslaag en milde, bolronde vorm."
      - name: brugse
        title: "Brugse Kaas"
        port: 8083
        description: "Brugse kaas is een heerlijke Belgische klassieker met een rijke traditie en volle smaak."
      - name: stilton
        title: "Stilton Kaas"
        port: 8084
        description: "Stilton is een iconische Britse blauwaderkaas met een intense, karakteristieke smaak."
      - name: milner
        title: "Milner Kaas"
        port: 8085
        description: "Milner kaas is gemaakt van halfvolle melk en is daardoor minder vet, maar vol van smaak."

  tasks:
    - name: Zorg ervoor dat de basisdirectory voor de websites bestaat
      ansible.builtin.file:
        path: "/opt/kaas_sites/{{ item.name }}"
        state: directory
        mode: '0755'
      loop: "{{ cheese_list }}"

    - name: Genereer de index.html voor elke kaascontainer
      ansible.builtin.copy:
        dest: "/opt/kaas_sites/{{ item.name }}/index.html"
        mode: '0644'
        content: |
          <!DOCTYPE html>
          <html lang="nl">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>{{ item.title }}</title>
              <style>
                  body {
                      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                      background-color: #fcf8f2;
                      color: #333;
                      text-align: center;
                      padding: 50px 20px;
                      margin: 0;
                  }
                  .container {
                      max-width: 600px;
                      margin: 0 auto;
                      background: white;
                      padding: 30px;
                      border-radius: 12px;
                      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
                      border-top: 8px solid #f4b400;
                  }
                  h1 {
                      color: #d48c00;
                      margin-bottom: 20px;
                  }
                  p {
                      font-size: 1.2em;
                      line-height: 1.6;
                      color: #555;
                  }
                  .footer {
                      margin-top: 40px;
                      font-size: 0.85em;
                      color: #999;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>{{ item.title }}</h1>
                  <p>{{ item.description }}</p>
                  <div class="footer">Aangedreven door Apache2 & Ansible Docker Loop</div>
              </div>
          </body>
          </html>
      loop: "{{ cheese_list }}"

    - name: Start de Apache2 Docker containers
      community.docker.docker_container:
        name: "apache_{{ item.name }}"
        image: httpd:2.4-alpine
        state: started
        restart_policy: always
        ports:
          - "{{ item.port }}:80"
        volumes:
          - "/opt/kaas_sites/{{ item.name }}/index.html:/usr/local/apache2/htdocs/index.html:ro"
      loop: "{{ cheese_list }}"
